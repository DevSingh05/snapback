name: ci

on:
  pull_request:
  push:
    branches: [main]

# PR branches: a new push cancels the older run. Main: every merge gets its own group (by commit),
# so a later merge never cancels or drops the run for an earlier one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No sponsor data, secrets or large files
        run: bash scripts/check_repo_hygiene.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra agent --extra intake
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Same tests, in parallel (pytest-xdist). The timing tests run alone after, because they
      # measure wall-clock time and a busy CPU would make them flaky.
      - run: uv run pytest -n auto --ignore=tests/test_pattern_speed.py
      - run: uv run pytest tests/test_pattern_speed.py
      # V6 eval gate (#62): fixture case bank only, headless, no network. Writes to the runner's
      # temp dir so the tracked eval/results.csv is never changed by CI. Exit 1 = gate failed.
      - name: Eval gate (python -m snapback.eval)
        run: uv run python -m snapback.eval --baseline eval/baseline.csv --out "$RUNNER_TEMP/results.csv"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test -w apps/web
      - run: npm test -w apps/sidecar
      - run: npm run build
