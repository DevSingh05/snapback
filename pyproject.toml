[project]
name = "snapback"
version = "0.0.1"
description = "Checks a rental listing against the building's 3D scan and property record before a renter pays."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
vision = [
    "faiss-cpu>=1.16.0",
    "kornia>=0.9.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]
agent = [
    "deepagents>=0.7.38",
    "langchain-anthropic>=1.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapback"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
